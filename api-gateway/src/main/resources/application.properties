# ==========================================
# CONFIGURACION GENERAL
# ==========================================
spring.application.name=api-gateway
server.port=8083

# ==========================================
# CONEXION CON EUREKA
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# RUTAS DEL API GATEWAY
# SPRING CLOUD GATEWAY SERVER WEBMVC
# ==========================================

# Ruta hacia pacientes
spring.cloud.gateway.server.webmvc.routes[0].id=pacientes-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/pacientes/**

# Ruta hacia citas
spring.cloud.gateway.server.webmvc.routes[1].id=citas-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/citas/**
