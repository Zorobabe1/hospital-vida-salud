
name: CI - Hospital Vida Salud

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - pacientes-service
          - citas-service
          - eureka-server
          - api-gateway

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas del servicio
        working-directory: ${{ matrix.servicio }}
        run: mvn --batch-mode clean verify
